services:
    php:
        build: docker/php
        image: wobqqq/oc-php:8.4
        user: '${UID:-1000}:${GID:-1000}'
        working_dir: /app
        volumes:
            - .:/app
            # The core is required from its sibling checkout until it is on Packagist.
            - ../nova-aegis:/nova-aegis:ro
            - composer-cache:/tmp/composer

volumes:
    composer-cache:
